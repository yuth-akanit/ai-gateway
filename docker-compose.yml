services:
  ai-gateway:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ai-gateway-v1
    restart: always
    ports:
      - "3006:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - GATEWAY_OPENAI_KEY=${GATEWAY_OPENAI_KEY}
      - AI_GATEWAY_INTERNAL_KEY=${AI_GATEWAY_INTERNAL_KEY}
      - AI_GATEWAY_URL=${AI_GATEWAY_URL}
    networks:
      - n8n_default

networks:
  n8n_default:
    external: true
